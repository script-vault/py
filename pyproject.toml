[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-utils"
version = "0.1.0"
description = "Standalone, reusable Python utility modules."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
full = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "openpyxl>=3.1",
    "pyarrow>=14.0",
]

[tool.setuptools]
py-modules = ["data_io"]
